[project]
name = "check-health"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3,<4",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "bcrypt>=5.0.0",
    "apscheduler>=3.11.3",
    "openpyxl>=3.1.5",
    "cryptography>=50.0.1",
    "psutil>=7.2.2",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
prod = ["gunicorn>=26.2.0"]

[tool.uv]
package = false

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["BLE001", "S110", "S112"]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
